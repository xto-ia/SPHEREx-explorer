<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Hosting offline — SPHEREx Sky Explorer</title>
    <meta
      name="description"
      content="Standalone fallback page shown when the SPHEREx Sky Explorer hosting is unreachable."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%2356B6C2' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M 11.11 6.6 A 10.6 10.6 0 1 1 6.6 11.11'/%3E%3Cpath d='M 13 10.23 A 6.5 6.5 0 1 1 10.23 13'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%2356B6C2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --canvas: #09090b;
        --line: #27272a;
        --accent: #56b6c2;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        background: var(--canvas);
        color: #d4d4d8;
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }

      ::selection {
        background: rgba(86, 182, 194, 0.28);
        color: #ecfeff;
      }

      :focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- decorative backdrop ---------- */

      #stars {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.55;
      }

      /* ---------- header ---------- */

      .site-header {
        position: relative;
        z-index: 10;
        border-bottom: 1px solid var(--line);
      }

      .header-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        padding: 0 16px;
      }

      @media (min-width: 640px) {
        .header-inner {
          padding: 0 24px;
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        user-select: none;
      }

      .brand svg {
        display: block;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
      }

      .brand-wordmark {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-family: var(--mono);
        text-transform: uppercase;
        line-height: 1;
      }

      .brand-name {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: #f4f4f5;
      }

      .brand-suffix {
        display: none;
        font-size: 9px;
        letter-spacing: 0.28em;
        color: var(--accent);
      }

      @media (min-width: 560px) {
        .brand-suffix {
          display: inline;
        }
      }

      .lang-switch {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.4);
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1;
        transition: border-color 150ms ease;
      }

      .lang-switch:hover {
        border-color: #3f3f46;
      }

      .lang-switch .bracket {
        padding: 0 6px;
        color: #52525b;
        user-select: none;
      }

      .lang-switch .separator {
        padding: 0 2px;
        color: #3f3f46;
        user-select: none;
      }

      .lang-switch button {
        appearance: none;
        border: 0;
        margin: 0;
        padding: 6px;
        background: transparent;
        font: inherit;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: #71717a;
        cursor: pointer;
        transition: color 150ms ease;
      }

      .lang-switch button:hover {
        color: #e4e4e7;
      }

      .lang-switch button[aria-pressed="true"] {
        color: var(--accent);
      }

      /* ---------- main ---------- */

      main {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(40px, 9vw, 96px) 20px;
      }

      .message {
        width: 100%;
        max-width: 560px;
      }

      .eyebrow {
        margin: 0 0 18px;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-family: var(--mono);
        font-size: clamp(26px, 4.4vw, 36px);
        font-weight: 600;
        line-height: 1.14;
        letter-spacing: -0.02em;
        color: #f4f4f5;
      }

      p {
        margin: 18px 0 0;
        max-width: 48ch;
        font-size: 14px;
        line-height: 1.8;
        color: #a1a1aa;
      }

      /* ---------- footer ---------- */

      .site-footer {
        position: relative;
        z-index: 1;
        padding: 18px 20px 22px;
        text-align: center;
      }

      .site-footer p {
        margin: 0 auto;
        max-width: none;
        font-family: var(--mono);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        line-height: 1.6;
        color: #52525b;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <header class="site-header">
      <div class="header-inner">
        <div class="brand" role="img" aria-label="SPHEREx Explorer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
            <path
              d="M 13.28 14.73 L 4.4 10.59 A 12.8 12.8 0 0 1 10.59 4.4 L 14.73 13.28 A 3 3 0 0 0 13.28 14.73 Z"
              fill="#56B6C2"
            />
            <g fill="none" stroke="#56B6C2" stroke-width="1.6" stroke-linecap="round">
              <path d="M 11.11 6.6 A 10.6 10.6 0 1 1 6.6 11.11" />
              <path d="M 13 10.23 A 6.5 6.5 0 1 1 10.23 13" />
            </g>
            <circle cx="16" cy="16" r="1.9" fill="#56B6C2" />
          </svg>
          <span class="brand-wordmark">
            <span class="brand-name">SPHEREx</span>
            <span class="brand-suffix">Explorer</span>
          </span>
        </div>

        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
          <span class="bracket" aria-hidden="true">[</span>
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <span class="separator" aria-hidden="true">|</span>
          <button type="button" data-lang="uk" aria-pressed="false">UA</button>
          <span class="bracket" aria-hidden="true">]</span>
        </div>
      </div>
    </header>

    <main>
      <div class="message">
        <p class="eyebrow" data-i18n="badge">Hosting offline</p>
        <h1 data-i18n="titleText">Unexpected difficulties.</h1>
        <p data-i18n="body">
          The SPHEREx Sky Explorer hosting is temporarily unreachable. We are working on a fix —
          please reload the page in a few minutes.
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <p>SPHEREx Sky Explorer · NASA Space Apps Challenge</p>
    </footer>

    <script>
      (function () {
        "use strict";

        var STORAGE_KEY = "spherex.offline.lang";

        var copy = {
          en: {
            title: "Hosting offline — SPHEREx Sky Explorer",
            description:
              "Standalone fallback page shown when the SPHEREx Sky Explorer hosting is unreachable.",
            language: "Language",
            badge: "Hosting offline",
            titleText: "Unexpected difficulties.",
            body:
              "The SPHEREx Sky Explorer hosting is temporarily unreachable. We are working on a fix — please reload the page in a few minutes.",
          },
          uk: {
            title: "Хостинг недоступний — SPHEREx Sky Explorer",
            description:
              "Окрема сторінка-заглушка, яка показується, коли хостинг SPHEREx Sky Explorer недоступний.",
            language: "Мова",
            badge: "Хостинг недоступний",
            titleText: "Виникли неочікувані труднощі.",
            body:
              "Хостинг SPHEREx Sky Explorer тимчасово недоступний. Ми працюємо над виправленням — спробуйте перезавантажити сторінку через кілька хвилин.",
          },
        };

        function readStoredLang() {
          try {
            var stored = window.localStorage.getItem(STORAGE_KEY);
            if (stored === "en" || stored === "uk") return stored;
          } catch (error) {
            /* Storage can be blocked (private mode, file://); fall through. */
          }
          /* English is the default language of this page. */
          return "en";
        }

        function storeLang(lang) {
          try {
            window.localStorage.setItem(STORAGE_KEY, lang);
          } catch (error) {
            /* Non-fatal: the toggle still works for this view. */
          }
        }

        function applyLanguage(lang) {
          var strings = copy[lang] || copy.en;

          document.documentElement.lang = lang;
          document.title = strings.title;

          var metaDescription = document.querySelector('meta[name="description"]');
          if (metaDescription) metaDescription.setAttribute("content", strings.description);

          var switcher = document.getElementById("lang-switch");
          if (switcher) switcher.setAttribute("aria-label", strings.language);

          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i += 1) {
            var key = nodes[i].getAttribute("data-i18n");
            var value = strings[key];
            if (typeof value === "string") nodes[i].textContent = value;
          }

          var buttons = document.querySelectorAll("#lang-switch button");
          for (var j = 0; j < buttons.length; j += 1) {
            var isActive = buttons[j].getAttribute("data-lang") === lang;
            buttons[j].setAttribute("aria-pressed", isActive ? "true" : "false");
          }
        }

        var buttons = document.querySelectorAll("#lang-switch button");
        for (var i = 0; i < buttons.length; i += 1) {
          buttons[i].addEventListener("click", function (event) {
            var lang = event.currentTarget.getAttribute("data-lang");
            if (lang !== "en" && lang !== "uk") return;
            storeLang(lang);
            applyLanguage(lang);
          });
        }

        applyLanguage(readStoredLang());

        /* ---------- deterministic starfield (same recipe as the app) ---------- */

        function mulberry32(seed) {
          var a = seed;
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        var STAR_TINTS = ["#ffffff", "#d4d4d8", "#a1a1aa", "#56b6c2"];

        function drawStars() {
          var canvas = document.getElementById("stars");
          if (!canvas || !canvas.getContext) return;
          var ctx = canvas.getContext("2d");
          if (!ctx) return;

          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          var width = window.innerWidth;
          var height = window.innerHeight;

          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, width, height);

          var random = mulberry32(20250501);
          var count = Math.round((width * height) / 6500);

          for (var i = 0; i < count; i += 1) {
            var x = random() * width;
            var y = random() * height;
            var radius = random() < 0.94 ? random() * 0.8 + 0.2 : random() * 1.3 + 0.8;
            var alpha = random() * 0.45 + 0.1;
            var tint = STAR_TINTS[Math.floor(random() * STAR_TINTS.length)];

            ctx.globalAlpha = alpha;
            ctx.fillStyle = tint;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }

          for (var g = 0; g < 10; g += 1) {
            var gx = random() * width;
            var gy = random() * height;
            var gr = random() * 1.4 + 1;
            var gradient = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr * 6);
            gradient.addColorStop(0, "rgba(236, 240, 245, 0.7)");
            gradient.addColorStop(0.35, "rgba(226, 232, 240, 0.12)");
            gradient.addColorStop(1, "rgba(9, 9, 11, 0)");

            ctx.globalAlpha = 1;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(gx, gy, gr * 6, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.globalAlpha = 1;
        }

        drawStars();

        var resizeTimer = 0;
        window.addEventListener("resize", function () {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(drawStars, 120);
        });
      })();
    </script>
  </body>
</html>
